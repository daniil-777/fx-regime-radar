name: daily-refresh

on:
  schedule:
    - cron: "0 6 * * 1-5"   # weekdays 06:00 UTC (after the previous FX day has closed)
  workflow_dispatch: {}      # manual runs from the Actions tab

permissions:
  contents: write            # needed to commit refreshed artifacts back to the repo

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run the daily pipeline (loads saved models, never trains)
        run: python pipelines/run_daily.py
        # No secrets here on purpose: the pipeline runs fully without a key
        # (the phase-09 narrator falls back to its template). ANTHROPIC_API_KEY,
        # when added, is passed as a repository secret — never written to files.

      - name: Commit refreshed artifacts
        run: |
          git config user.name "fx-regime-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no artifact changes (already up to date)"; exit 0
          fi
          git commit -m "data: daily refresh [skip ci]"
          git push
