name: daily-refresh

on:
  schedule:
    - cron: "0 6 * * 1-5"   # weekdays 06:00 UTC (after the previous FX day has closed)
  workflow_dispatch: {}      # manual runs from the Actions tab

permissions:
  contents: write            # needed to commit refreshed artifacts back to the repo

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Fetch new central-bank statements (official sites only; soft-fails offline)
        run: python -m fxradar.cb_text --backfill --since 2020 || echo "cb fetch skipped"

      - name: Run the daily pipeline for every universe (loads saved models, never trains)
        run: |
          python pipelines/run_daily.py
          FXRADAR_UNIVERSE=g10 python pipelines/run_daily.py
          FXRADAR_UNIVERSE=crypto python pipelines/run_daily.py
        env:
          # Optional. When the repository secret is absent this is empty and the
          # narrator uses its deterministic template — the run still succeeds.
          # The key only ever lives in memory; nothing writes it to files or logs.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit refreshed artifacts (+ the README live-record block and badge JSON)
        run: |
          git config user.name "fx-regime-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          # First run on a fresh fork: point the README badges at this repository.
          sed -i "s#OWNER/REPO#${{ github.repository }}#g" README.md
          git add data/ README.md reports/live_scoreboard.md reports/live_scoreboard.json
          if git diff --cached --quiet; then
            echo "no artifact changes (already up to date)"; exit 0
          fi
          git commit -m "data: daily refresh [skip ci]"
          git push
