name: ci

# The badge in the README points here: every push and PR runs lint + the full test suite.
# Data refresh commits carry [skip ci] so the badge reflects code, not the daily artifacts.
on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "docs/screenshots/**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Lint (ruff) + format check (black)
        run: |
          ruff check .
          black --check .
      - name: Tests (no network, no API key needed)
        run: python -m pytest -q
      - name: Ledger hash chain must verify on the committed data
        run: |
          python - <<'PY'
          from fxradar import ledger
          led = ledger.load()
          assert ledger.verify_chain(led), "data/ledger.parquet: hash chain broken"
          print(f"ledger ok: {len(led)} rows, chain verified")
          PY
