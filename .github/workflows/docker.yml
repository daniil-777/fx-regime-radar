# Proves the production image builds and serves: builds deploy/Dockerfile, starts the container,
# waits for Streamlit's health endpoint. Runs when anything the image contains changes.
name: docker image
on:
  push:
    branches: [main]
    paths: ["deploy/**", "requirements.txt", "pyproject.toml", "app/**", "src/**", ".dockerignore"]
  pull_request:
    paths: ["deploy/**", "requirements.txt", "pyproject.toml", "app/**", "src/**", ".dockerignore"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: docker build -f deploy/Dockerfile -t fxradar-app:ci .
      - name: run + health check
        run: |
          docker run -d --name radar -p 8501:8501 fxradar-app:ci
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8501/_stcore/health | grep -q ok; then echo healthy; exit 0; fi
            sleep 3
          done
          docker logs radar; exit 1
