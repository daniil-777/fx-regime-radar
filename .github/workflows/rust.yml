name: rust-engine

on:
  push:
    paths: ["rust/**", "models/bundle_v*/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "models/bundle_v*/**"]
  workflow_dispatch: {}

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust/fxradar-serve
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/fxradar-serve
      - name: fmt
        run: cargo fmt --check
      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: unit + integration tests
        run: cargo test --release
      - name: golden-vector self-test against the committed bundle
        run: cargo run --release --bin selftest -- ../../models/bundle_v1.4.0
