# Deploy the app image to Google Cloud Run. Inactive until the repository VARIABLE GCP_PROJECT is set
# (Settings → Secrets and variables → Actions → Variables) and the SECRET GCP_SA_KEY holds a service
# account key — see docs/DEPLOY_CLOUD_RUN.md. Runs on code/artifact pushes and after every
# daily-refresh run (that commit carries "[skip ci]", so a plain push trigger would miss it).
name: cloud run
on:
  push:
    branches: [main]
    paths: ["deploy/**", "requirements.txt", "pyproject.toml", "app/**", "src/**", "data/**", "models/**", "reports/**", ".streamlit/**"]
  workflow_run:
    workflows: ["daily-refresh"]
    types: [completed]
  workflow_dispatch:
concurrency: { group: cloudrun, cancel-in-progress: true }
env:
  REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
  SERVICE: ${{ vars.CLOUDRUN_SERVICE || 'fx-regime-radar' }}
  REPO: fxradar
jobs:
  deploy:
    if: vars.GCP_PROJECT != '' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: google-github-actions/auth@v2
        with: { credentials_json: "${{ secrets.GCP_SA_KEY }}" }
      - uses: google-github-actions/setup-gcloud@v2
      - name: build + push (Artifact Registry)
        run: |
          IMAGE="$REGION-docker.pkg.dev/${{ vars.GCP_PROJECT }}/$REPO/app"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f deploy/Dockerfile -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
          echo "IMAGE=$IMAGE:${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --project "${{ vars.GCP_PROJECT }}" --region "$REGION" --platform managed \
            --image "$IMAGE" --port 8080 --allow-unauthenticated \
            --cpu 1 --memory 2Gi --concurrency 40 --timeout 3600 --session-affinity \
            --min-instances "${{ vars.CLOUDRUN_MIN_INSTANCES || '1' }}" --max-instances 3 \
            --set-env-vars "STREAMLIT_SERVER_HEADLESS=true" \
            ${{ vars.ANTHROPIC_SECRET_NAME && format('--set-secrets ANTHROPIC_API_KEY={0}:latest', vars.ANTHROPIC_SECRET_NAME) || '' }}
          gcloud run services describe "$SERVICE" --project "${{ vars.GCP_PROJECT }}" --region "$REGION" --format 'value(status.url)'
