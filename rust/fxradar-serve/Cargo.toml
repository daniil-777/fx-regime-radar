[package]
name = "fxradar-serve"
version = "2.0.0"
edition = "2021"
description = "FX Regime Radar — production scoring engine (reads only the model bundle; no Python)"
license = "MIT"
publish = false

[lib]
name = "fxradar_serve"
path = "src/lib.rs"

[[bin]]
name = "selftest"
path = "src/bin/selftest.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
ndarray = "0.16"
sha2 = "0.10"
hex = "0.4"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native", "copy-dylibs", "api-27"] }
parquet = { version = "59", default-features = false, features = ["snap"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
approx = "0.5"

[[bench]]
name = "scoring"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
