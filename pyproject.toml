[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fxradar"
version = "1.3.1"
description = "FX Regime Radar — a weather station for currency markets (regimes, change risk, anomalies)."
requires-python = ">=3.11"
readme = "README.md"
# Runtime deps are pinned in requirements.txt (single source of truth for installs).
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app", "pipelines"]

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes, I = import sorting, B = bugbear, UP = pyupgrade.
select = ["E", "F", "I", "B", "UP"]
# E501 (line length) is black's job.
ignore = ["E501"]
