intent_version: 1.0.0
note: The canonical intent set. Parameters are pair and locale only — anything needing a user-supplied
  quantity (an exposure, a hypothetical move) is excluded by construction, because it cannot be built
  before the user speaks.
excluded_from_precompute:
- exposure_calculator
- hedge_ladder_plan
- impact_waterfall
- scenario_ladder
